# Generate with: cd ios && xcodegen generate
# ios/App/App.xcodeproj is a symlink to ../App.xcodeproj so `npx cap sync ios` finds the project.
name: App
options:
  bundleIdPrefix: com.stevenellis.functionaltrainer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Steven Ellis (Personal Team). Free team: installed builds expire after 7 days.
    DEVELOPMENT_TEAM: T2P62T7K9D
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: YES

# Capacitor's local SPM package (rewritten by `npx cap sync ios`).
packages:
  CapApp-SPM:
    path: App/CapApp-SPM

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/App
        excludes:
          - Info.plist
          - public
      # Web build copied in by `npx cap sync ios`, kept as a folder reference.
      - path: App/App/public
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
      - target: Widgets
        embed: true
    entitlements:
      path: App/App/App.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/App/Info.plist
      properties:
        CAPACITOR_DEBUG: $(CAPACITOR_DEBUG)
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Functional Trainer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIMainStoryboardFile: Main
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
                UISceneStoryboardFile: Main
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: Functional Trainer reads your heart rate so it can show it during a workout.
        NSHealthUpdateUsageDescription: Functional Trainer saves your finished workouts to Apple Health.
        NSBluetoothAlwaysUsageDescription: Functional Trainer connects to your Bluetooth heart rate strap.
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenellis.functionaltrainer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CAPACITOR_DEBUG: "$(inherited)"
      configs:
        Debug:
          CAPACITOR_DEBUG: "true"

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Functional Trainer Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenellis.functionaltrainer.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
